{{- range .Values.components }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  labels:
    app: {{ .name }}
spec:
  replicas: {{ $.Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .name }}
  template:
    metadata:
      labels:
        app: {{ .name }}
    spec:
      volumes:
        - name: html
          configMap:
            name: {{ .name }}-html
      containers:
        - name: {{ .name }}
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          ports:
            - containerPort: {{ $.Values.service.targetPort }}
          env:
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: superdataportsecret
                  key: password
          volumeMounts:
            - name: html
              mountPath: /var/www/html/index.html
              subPath: index.html
              readOnly: true
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
---
{{- end}}